<style>
:root{
  /* Layout idea: a handheld console. Dark shell, pale LCD "screen" panels, chunky ink borders. Single theme by choice. */
  color-scheme: dark;
  --shell:#1c2230;      /* page / console body */
  --shell-2:#2a3346;    /* raised shell parts */
  --lcd:#e7efd3;        /* screen paper */
  --lcd-2:#d3dfb8;      /* screen paper, shaded */
  --ink:#1d2a2a;        /* text + borders on LCD */
  --jade:#1f8a70;       /* accent */
  --gold:#f2b632;       /* badges, highlights */
  --hurt:#d0344a;       /* damage, errors */
  --t1:#cf2f3c; --t2:#15803d; --t3:#1c5fd0; --t4:#7a2fc4; --t5:#6b7280; /* tone colours */
  --display:"Press Start 2P", ui-monospace, "Courier New", monospace;
  --body:ui-monospace, "SF Mono", Menlo, Consolas, "Courier New", monospace;
  --han:"Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Heiti SC", sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden}
body{overscroll-behavior:none;background:var(--shell);color:var(--lcd);font:15px/1.45 var(--body);-webkit-tap-highlight-color:transparent}
#app{height:100%;max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;flex-direction:column;gap:8px}
#hud,#pad,.help{flex-shrink:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* HUD */
#hud{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.brand{font:12px var(--display);letter-spacing:1px;display:flex;align-items:center;gap:8px;margin-right:auto}
.brand i{font:900 20px var(--han);font-style:normal;color:var(--gold)}
#badges{display:flex;gap:4px}
.badge{width:26px;height:26px;border-radius:50%;border:2px dashed #55607a;display:grid;place-items:center;font:900 14px var(--han);color:transparent}
.badge.on{border:2px solid #7a5a00;background:var(--gold);color:#3b2b00}
.hp{display:flex;align-items:center;gap:6px;font:10px var(--display)}
.hp .bar{width:92px;height:12px;background:#0e1219;border:2px solid #55607a;border-radius:3px;overflow:hidden}
.hp .bar i{display:block;height:100%;background:#4ccf7c;transition:width .25s}
.hp .bar i.low{background:var(--hurt)}
.hud-btn{background:var(--shell-2);border:2px solid #55607a;border-radius:4px;padding:7px 9px;font:9px var(--display)}
.hud-btn:hover{border-color:var(--gold)}
.hud-btn[aria-pressed="false"]{color:#98a2b8}
#btnBgm[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}

/* Stage */
#stage{background:var(--lcd);color:var(--ink);border:4px solid #0e1219;border-radius:8px;box-shadow:0 0 0 3px var(--shell-2);overflow:hidden;flex:1;min-height:0;display:flex;flex-direction:column}
#world{position:relative;line-height:0;flex:1;min-height:0;background:#000}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
#zoneTag{position:absolute;top:8px;left:8px;background:var(--ink);color:var(--lcd);font:9px/1.4 var(--display);padding:7px 9px;border-radius:3px;opacity:0;transition:opacity .4s;pointer-events:none}
#zoneTag.show{opacity:.92}
#dialog{position:absolute;left:8px;right:8px;bottom:8px;max-width:720px;margin:0 auto;background:var(--lcd);border:3px solid var(--ink);border-radius:4px;box-shadow:0 3px 0 var(--ink);padding:10px 12px 14px;line-height:1.45;cursor:pointer;min-height:76px}
#dlgName{font:700 12px var(--body);letter-spacing:.3px;color:var(--jade);margin-bottom:6px}
#dlgText [lang]{font-family:var(--han);font-weight:500}
#dialog .next{position:absolute;right:10px;bottom:4px;font-size:11px;animation:bob .7s steps(2) infinite}
@keyframes bob{50%{transform:translateY(3px)}}

/* Battle */
#battle{flex:1;min-height:0;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
#battle>*{width:100%;max-width:720px;margin-inline:auto;flex-shrink:0}
.plate{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font:10px/1.5 var(--display)}
.chip{font:8px var(--display);padding:4px 6px;border:2px solid var(--ink);border-radius:3px;background:var(--lcd-2)}
.chip.new{background:var(--gold)}
.chip.nm{font:700 11px var(--body)}
.chip.rev{background:var(--hurt);color:#fff}
.log.npc{background:#fff;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.btn.mini{min-height:44px;padding:4px 12px;font-size:13px;box-shadow:0 2px 0 var(--ink);flex-shrink:0;white-space:nowrap}
#battle.scene .hearts{letter-spacing:1px}
#battle.scene .btn{position:relative}
#battle.scene .btn .k{position:absolute;left:8px;top:6px;margin:0}
#battle.scene .log.npc p{margin:0}
#battle.scene .log.npc .who{margin-bottom:4px}
#battle.scene .log.npc .btn.mini{font-size:18px;padding:4px 10px}
@media (max-width:520px),(max-height:560px){
  #battle.scene{gap:8px}
  #battle.scene .btn{min-height:48px;padding:5px 8px}
  #battle.scene .oh{font-size:17px}
  #battle.scene .sent{font-size:18px}
  #battle.scene .log{padding:8px 10px;min-height:0}
  #battle.scene .prompt{font-size:15px}
  #battle.scene .slots,#battle.scene .bank{min-height:64px;padding:6px;gap:6px}
  #battle.scene .tile{min-height:50px;min-width:50px;padding:4px 10px}
  #battle.scene .tile b{font-size:21px}
  #battle.scene .log.npc{font-size:14px}
  #battle.scene .sent{font-size:17px}
  #battle.scene .prompt small{margin-bottom:3px}
  #battle.scene .plate{gap:6px}
}
.log .who{font:700 11px var(--body);letter-spacing:.5px;color:var(--jade);margin:0 0 6px}
.btn .oh{display:block;font:900 19px/1.3 var(--han)}
.btn .py{display:block;font-weight:400;font-size:12px}
.tabs{display:flex;gap:8px;margin:2px 0 10px}
.tabs .btn{flex:1}
.tabs .btn[aria-selected="true"]{background:var(--ink);color:var(--lcd)}
.cards.wide{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card.pcard{display:flex;flex-direction:column;gap:3px}
.pcard .ph{font:900 20px/1.3 var(--han);text-align:left;background:none;border:0;padding:4px 0;color:var(--ink);min-height:36px}
.pcard small{font:500 13px var(--han);color:var(--t5)}
.foot .rev{color:var(--hurt);font-weight:700}
.hearts{margin-left:auto;font:18px/1 var(--body);color:var(--hurt);letter-spacing:2px}
.spirit{align-self:center;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.glyph{font:900 clamp(56px,min(19vw,17vh),120px)/1.1 var(--han);animation:float 2.4s ease-in-out infinite;text-shadow:3px 3px 0 rgba(29,42,42,.14)}
@keyframes float{50%{transform:translateY(-6px)}}
.t1{color:var(--t1)}.t2{color:var(--t2)}.t3{color:var(--t3)}.t4{color:var(--t4)}.t5{color:var(--t5)}
.glyph .ask{color:var(--ink);border-bottom:6px dotted var(--ink)}
.glyph .dim{color:#a9b596}
.pyline{font:600 20px var(--body);min-height:28px}
.meta{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;font-size:13px}
.meta span{border:2px solid var(--ink);border-radius:3px;padding:2px 8px;background:var(--lcd-2)}
.meta b{font:900 16px var(--han)}
.log{border:3px solid var(--ink);border-radius:4px;background:#f6fae9;padding:10px 12px;min-height:62px}
.log [lang],.panel [lang]{font-family:var(--han)}
.log .bad{color:var(--hurt);font-weight:700}
.log .good{color:var(--jade);font-weight:700}
.log p{margin:0 0 6px}.log p:last-child{margin:0}
.q{font-weight:700;margin:0 0 2px}
.q b{font:900 20px var(--han)}
.panel{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.panel.one{grid-template-columns:1fr}
.btn{background:var(--lcd);color:var(--ink);border:3px solid var(--ink);border-radius:4px;box-shadow:0 3px 0 var(--ink);padding:10px;font-weight:700;text-align:center;min-height:54px;touch-action:manipulation}
.btn:hover{background:#f6fae9}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn:disabled{opacity:.45;cursor:default;transform:none;box-shadow:0 3px 0 var(--ink)}
.btn.primary{background:var(--jade);color:#fff}
.btn small{display:block;font-weight:400;opacity:.8}
.btn .k{font:8px var(--display);opacity:.55;margin-right:6px}
.tb1{border-color:var(--t1);color:var(--t1);box-shadow:0 3px 0 var(--t1)}
.tb2{border-color:var(--t2);color:var(--t2);box-shadow:0 3px 0 var(--t2)}
.tb3{border-color:var(--t3);color:var(--t3);box-shadow:0 3px 0 var(--t3)}
.tb4{border-color:var(--t4);color:var(--t4);box-shadow:0 3px 0 var(--t4)}
.tb5{border-color:var(--t5);color:var(--t5);box-shadow:0 3px 0 var(--t5)}
.han{font-family:var(--han);font-weight:900}

/* Sentence tiles */
.prompt{font-weight:700;font-size:17px}
.prompt small{display:block;font:8px var(--display);color:var(--jade);margin-bottom:6px}
.slots,.bank{display:flex;flex-wrap:wrap;gap:8px;min-height:76px;padding:8px;border-radius:4px;align-content:flex-start}
.slots{border:3px dashed var(--ink);background:#f6fae9}
.bank{background:var(--lcd-2)}
.slots:empty::before{content:"Tap the tiles in the right order";opacity:.55;align-self:center}
.tile{background:#fff;border:3px solid var(--ink);border-radius:4px;box-shadow:0 3px 0 var(--ink);padding:7px 12px;min-width:56px;min-height:56px;text-align:center;color:var(--ink);touch-action:manipulation}
.tile b{display:block;font:900 24px/1.2 var(--han)}
.tile .py,.tile .pyr{display:block;font-size:11px;line-height:1.2}
.nopy .py{display:none}
.sent{font:900 20px var(--han)}

    ['他是谁？', 'Tā shì shéi?', 'Who is he?', '他是誰？'], ['你去哪儿？', 'Nǐ qù nǎr?', 'Where are you going?', '你去哪兒？'], ['你什么时候来？', 'Nǐ shénme shíhou lái?', 'When are you coming?', '你什麼時候來？'], ['你要几个？', 'Nǐ yào jǐ ge?', 'How many do you want? (几 for small numbers)', '你要幾個？']],
    tip: 'Answer in the same slot: 你去哪儿？→ 我去公司。Never add 吗 to a question that already has a question word.', go: 'Every NPC with a speech bubble asks you at least one of these.' },
  { id: 'family', t: 'Family and People', sum: 'Talk about your family and the people around you.', lines: [
    ['我家有四口人。', 'Wǒ jiā yǒu sì kǒu rén.', 'There are four people in my family.', ''], ['爸爸，妈妈', 'bàba, māma', 'dad, mom', '爸爸，媽媽'], ['哥哥，姐姐', 'gēge, jiějie', 'older brother, older sister', ''], ['弟弟，妹妹', 'dìdi, mèimei', 'younger brother, younger sister', ''],
    ['这是我朋友。', 'Zhè shì wǒ péngyou.', 'This is my friend.', '這是我朋友。'], ['你有孩子吗？', 'Nǐ yǒu háizi ma?', 'Do you have children?', '你有孩子嗎？']],
    tip: 'Drop 的 with close family and friends: 我妈妈, 我朋友, not 我的妈妈. 口 counts family members.', go: 'Xiǎo Lì in the Town Market.' },
  { id: 'mw', t: 'Measure Words', sum: 'Number, 这 or 那 + measure word + noun. You cannot say 三茶.', lines: [
    ['一个人', 'yí ge rén', 'one person: 个 is the all-purpose measure word', '一個人'], ['三杯茶', 'sān bēi chá', 'three cups of tea', ''], ['两碗面', 'liǎng wǎn miàn', 'two bowls of noodles', '兩碗麵'],
    ['一本书', 'yì běn shū', 'one book', '一本書'], ['这件衣服', 'zhè jiàn yīfu', 'this piece of clothing', '這件衣服'], ['几位？', 'Jǐ wèi?', 'How many people? (polite, from restaurant staff)', '幾位？']],
    tip: 'When you do not know the right measure word, 个 is almost always understood.', go: 'The Waiter and the Barista in the Town Market.' },
  { id: 'food', t: 'Food and Ordering', sum: 'Order, say what you do not eat, and ask for the bill.', lines: [
    ['我要这个。', 'Wǒ yào zhège.', 'I want this one.', '我要這個。'], ['我不吃肉。', 'Wǒ bù chī ròu.', 'I do not eat meat.', ''], ['不要辣。', 'Bú yào là.', 'Not spicy, please.', ''], ['我饿了。', 'Wǒ è le.', 'I am hungry.', '我餓了。'],
    ['好吃！', 'Hǎochī!', 'Delicious!', ''], ['服务员，买单！', 'Fúwùyuán, mǎidān!', 'Waiter, the bill please!', '服務員，買單！']],
    tip: '不要 + thing = "without": 不要冰 no ice, 不要糖 no sugar.', go: 'The Waiter and the Barista in the Town Market.' },
  { id: 'order', t: 'Time + Place + Action', sum: 'Word order: Subject + Time + Place + Action. When and where come before the verb.', lines: [
    ['我今天在家吃饭。', 'Wǒ jīntiān zài jiā chīfàn.', 'I am eating at home today.', '我今天在家吃飯。'], ['他明天在北京工作。', 'Tā míngtiān zài Běijīng gōngzuò.', 'He works in Beijing tomorrow.', ''], ['我们三点去商店。', 'Wǒmen sān diǎn qù shāngdiàn.', 'We go to the shop at three.', '我們三點去商店。'], ['我在公司工作。', 'Wǒ zài gōngsī gōngzuò.', 'I work at the office. (在 + place + action)', '']],
    tip: 'Time can also open the sentence: 今天我在家吃饭.', go: 'Leader Lǐ at the east gate of the Village.' },
  ] },
{ k: '2', tab: 'HSK 2', name: 'HSK 2 · Daily Life', cefr: 'A1', target: 'HSK 3.0 Level 2: 500 words, 371 characters to recognise, 100 to write by hand. No speaking test.',
  can: ['Describe your daily routine', 'Say what you did and what you have done', 'Ask for directions, take transport, shop and pay', 'Compare things and say what you can, may or want to do'],
  cards: [
  { id: 'routine', t: 'Daily Routine', sum: 'Get up, commute, work, eat, train and sleep.', lines: [
    ['我每天七点起床。', 'Wǒ měi tiān qī diǎn qǐchuáng.', 'I get up at seven every day.', '我每天七點起床。'], ['我坐地铁上班。', 'Wǒ zuò dìtiě shàngbān.', 'I take the MTR to work.', '我坐地鐵上班。'], ['中午我跟同事吃饭。', 'Zhōngwǔ wǒ gēn tóngshì chīfàn.', 'At noon I eat with colleagues.', '中午我跟同事吃飯。'],
    ['下班以后我去健身房。', 'Xiàbān yǐhòu wǒ qù jiànshēnfáng.', 'After work I go to the gym.', '下班以後我去健身房。'], ['我晚上十一点睡觉。', 'Wǒ wǎnshang shíyī diǎn shuìjiào.', 'I go to bed at eleven at night.', '我晚上十一點睡覺。']],
    tip: '坐 for vehicles you sit in (bus, MTR, taxi). 骑 qí for bikes. 上班 = go to work, 下班 = finish work.', go: 'Leader Lǐ in the Village (word order), then MTR Staff in the Town Market.' },
  { id: 'le', t: '了: Things That Happened', sum: '了 after a verb marks a finished action. At the end of a sentence it marks a change.', lines: [
    ['我吃了。', 'Wǒ chī le.', 'I have eaten.', ''], ['我买了两本书。', 'Wǒ mǎi le liǎng běn shū.', 'I bought two books.', '我買了兩本書。'], ['你吃饭了吗？', 'Nǐ chīfàn le ma?', 'Have you eaten?', '你吃飯了嗎？'],
    ['我没去。', 'Wǒ méi qù.', 'I did not go. (no 了 after 没)', ''], ['下雨了。', 'Xiàyǔ le.', 'It has started raining. (a change)', ''], ['他来了。', 'Tā lái le.', 'He is here now.', '他來了。']],
    tip: 'For the past, negate with 没 and drop 了: 我没吃, not 我没吃了.', go: 'The Waiter in the Town Market, and Hiker Chén in the Crossroads.' },
  { id: 'guo', t: '过 and 在: Ever and Right Now', sum: '过 means you have done it at some point. 在 or 正在 before a verb means it is happening now.', lines: [
    ['我去过北京。', 'Wǒ qù guo Běijīng.', 'I have been to Beijing.', '我去過北京。'], ['你吃过榴莲吗？', 'Nǐ chī guo liúlián ma?', 'Have you ever eaten durian?', '你吃過榴槤嗎？'], ['我没看过。', 'Wǒ méi kàn guo.', 'I have never seen it.', '我沒看過。'],
    ['我在开会。', 'Wǒ zài kāihuì.', 'I am in a meeting right now.', '我在開會。'], ['他正在打电话。', 'Tā zhèngzài dǎ diànhuà.', 'He is on the phone right now.', '他正在打電話。']],
    tip: '在 before a verb = in progress. 在 before a place = location: 我在公司开会 does both.', go: 'Xiǎo Lì in the Town Market.' },
  { id: 'modal', t: 'Can, May, Want', sum: '会 is a learned skill, 能 is being able, 可以 is permission. 想 is a wish, 要 is an intention.', lines: [
    ['我会说一点儿中文。', 'Wǒ huì shuō yìdiǎnr Zhōngwén.', 'I can speak a little Chinese. (learned skill)', '我會說一點兒中文。'], ['我今天不能来。', 'Wǒ jīntiān bù néng lái.', 'I cannot come today. (not able)', '我今天不能來。'],
    ['这里可以拍照吗？', 'Zhèlǐ kěyǐ pāizhào ma?', 'Can I take photos here? (permission)', '這裡可以拍照嗎？'], ['我想喝水。', 'Wǒ xiǎng hē shuǐ.', 'I would like some water. (wish)', ''], ['我要去银行。', 'Wǒ yào qù yínháng.', 'I need to go to the bank. (intention)', '我要去銀行。']],
    tip: '我会游泳 = I know how to swim. 我今天不能游泳 = I cannot swim today (maybe I am injured).', go: 'The Barista (我要) and the Shopkeeper (可以) in the Town Market.' },
  { id: 'bi', t: 'Comparing with 比', sum: 'A + 比 + B + adjective. 最 means "the most".', lines: [
    ['今天比昨天冷。', 'Jīntiān bǐ zuótiān lěng.', 'Today is colder than yesterday.', ''], ['他比我高一点儿。', 'Tā bǐ wǒ gāo yìdiǎnr.', 'He is a bit taller than me.', '他比我高一點兒。'], ['地铁比出租车便宜多了。', 'Dìtiě bǐ chūzūchē piányi duō le.', 'The MTR is much cheaper than a taxi.', '地鐵比出租車便宜多了。'],
    ['我没有他那么忙。', 'Wǒ méiyǒu tā nàme máng.', 'I am not as busy as him.', '我沒有他那麼忙。'], ['这个最好。', 'Zhège zuì hǎo.', 'This one is the best.', '這個最好。']],
    tip: 'No 很 after 比: 比昨天冷, never 比昨天很冷. Add 一点儿 (a bit) or 多了 (much) after the adjective.', go: 'Lǎo Zhāng the neighbour (weather) in the Town Market.' },
  { id: 'transit', t: 'Directions and Transport', sum: 'Ask where a place is, follow directions, and tell a driver where to go.', lines: [
    ['请问，地铁站在哪儿？', 'Qǐngwèn, dìtiězhàn zài nǎr?', 'Excuse me, where is the MTR station?', '請問，地鐵站在哪兒？'], ['离这儿远吗？', 'Lí zhèr yuǎn ma?', 'Is it far from here?', '離這兒遠嗎？'], ['走路十分钟。', 'Zǒulù shí fēnzhōng.', 'Ten minutes on foot.', '走路十分鐘。'],
    ['往前走，然后左转。', 'Wǎng qián zǒu, ránhòu zuǒ zhuǎn.', 'Go straight, then turn left.', '往前走，然後左轉。'], ['师傅，我去火车站。', 'Shīfu, wǒ qù huǒchēzhàn.', 'Driver, I am going to the train station.', '師傅，我去火車站。'], ['在这儿停，谢谢。', 'Zài zhèr tíng, xièxie.', 'Stop here, thanks.', '在這兒停，謝謝。']],
    tip: '左 zuǒ = left, 右 yòu = right. 师傅 is the polite word for a driver or tradesperson.', go: 'MTR Staff in the Town Market.' },
  { id: 'cafe', t: 'Cafés', sum: 'Greet, order, choose hot or iced, here or to go.', lines: [
    ['你好！我要一杯咖啡。', 'Nǐ hǎo! Wǒ yào yì bēi kāfēi.', 'Hello! I would like a coffee.', ''], ['热的还是冰的？', 'Rè de háishi bīng de?', 'Hot or iced?', '熱的還是冰的？'], ['在这儿喝还是带走？', 'Zài zhèr hē háishi dàizǒu?', 'Drink here or take away?', '在這兒喝還是帶走？'], ['我要带走。', 'Wǒ yào dàizǒu.', 'To go, please.', '我要帶走。'], ['少糖，谢谢。', 'Shǎo táng, xièxie.', 'Less sugar, thanks.', '少糖，謝謝。']],
    tip: '还是 = "or" in a question. Order with 我要, not 买.', go: 'The Barista in the Town Market.' },
  { id: 'shop', t: 'Shopping and Paying', sum: 'Ask the price, react to it, and pay by card or phone.', lines: [
    ['这个多少钱？', 'Zhège duōshao qián?', 'How much is this one?', '這個多少錢？'], ['太贵了！', 'Tài guì le!', 'Too expensive!', '太貴了！'], ['便宜一点儿吧。', 'Piányi yìdiǎnr ba.', 'A little cheaper, please.', '便宜一點兒吧。'],
    ['可以刷卡吗？', 'Kěyǐ shuākǎ ma?', 'Can I pay by card?', '可以刷卡嗎？'], ['可以用支付宝吗？', 'Kěyǐ yòng Zhīfùbǎo ma?', 'Can I pay with Alipay?', '可以用支付寶嗎？'], ['我扫你吧。', 'Wǒ sǎo nǐ ba.', 'I will scan your code.', '我掃你吧。']],
    tip: 'Keep 这个 in the sentence: 我要这个, 我不要这个.', go: 'The Stall Owner and the Shopkeeper (mobile pay) in the Town Market.' },
  { id: 'phone', t: 'Phone and WeChat', sum: 'Swap numbers, add each other, and message later.', lines: [
    ['你的电话号码是多少？', 'Nǐ de diànhuà hàomǎ shì duōshao?', 'What is your phone number?', '你的電話號碼是多少？'], ['我们加个微信吧。', 'Wǒmen jiā ge Wēixìn ba.', 'Let us add each other on WeChat.', '我們加個微信吧。'],
    ['我给你发信息。', 'Wǒ gěi nǐ fā xìnxī.', 'I will send you a message.', '我給你發信息。'], ['你到了吗？', 'Nǐ dào le ma?', 'Have you arrived?', ''], ['我马上到。', 'Wǒ mǎshàng dào.', 'I will be there right away.', '我馬上到。']],
    tip: 'In phone numbers, 1 is read yāo so it is not confused with 七 qī.', go: 'Xiǎo Lì and the Shopkeeper in the Town Market.' },
  { id: 'weather', t: 'Weather', sum: 'The easiest small talk there is.', lines: [
    ['今天天气怎么样？', 'Jīntiān tiānqì zěnmeyàng?', 'What is the weather like today?', '今天天氣怎麼樣？'], ['今天很热。', 'Jīntiān hěn rè.', 'It is hot today.', '今天很熱。'], ['明天下雨。', 'Míngtiān xiàyǔ.', 'It will rain tomorrow.', ''], ['今天是晴天。', 'Jīntiān shì qíngtiān.', 'It is sunny today.', ''], ['外面很闷。', 'Wàimiàn hěn mēn.', 'It is muggy outside.', '外面很悶。']],
    tip: '冷 lěng = cold. 闷 mēn = stuffy and humid, very Hong Kong.', go: 'Lǎo Zhāng the neighbour in the Town Market.' },
  { id: 'health', t: 'Health Basics', sum: 'Say what hurts and ask for help.', lines: [
    ['我不舒服。', 'Wǒ bù shūfu.', 'I do not feel well.', ''], ['我头疼。', 'Wǒ tóu téng.', 'I have a headache.', '我頭疼。'], ['我感冒了。', 'Wǒ gǎnmào le.', 'I have a cold.', ''],
    ['我的左手很疼。', 'Wǒ de zuǒshǒu hěn téng.', 'My left hand really hurts.', ''], ['我要看医生。', 'Wǒ yào kàn yīshēng.', 'I need to see a doctor.', '我要看醫生。'], ['多喝水，多休息。', 'Duō hē shuǐ, duō xiūxi.', 'Drink plenty of water and rest.', '']],
    tip: 'Body part + 疼 = it hurts: 头疼, 肚子疼, 腿疼.', go: 'The Doctor in the Academy (Clinic conversation).' },
  ] },
{ k: '3', tab: 'HSK 3', name: 'HSK 3 · Real Conversations', cefr: 'A2', target: 'HSK 3.0 Level 3: 1,000 words, 655 characters to recognise, 250 to write. The speaking test becomes part of the exam from HSK 3.',
  can: ['Give reasons and contrasts in one sentence', 'Handle work, the clinic and renting a flat', 'Give an opinion and describe changes', 'Explain when, where and how something happened'],
  cards: [
  { id: 'shide', t: '是……的: Details of the Past', sum: 'When an action is already known, 是……的 asks or tells when, where, how or with whom.', lines: [
    ['你是什么时候来的？', 'Nǐ shì shénme shíhou lái de?', 'When did you come?', '你是什麼時候來的？'], ['我是去年来香港的。', 'Wǒ shì qùnián lái Xiānggǎng de.', 'I came to Hong Kong last year.', '我是去年來香港的。'],
    ['你是怎么来的？', 'Nǐ shì zěnme lái de?', 'How did you get here?', '你是怎麼來的？'], ['我是坐出租车来的。', 'Wǒ shì zuò chūzūchē lái de.', 'I came by taxi.', '我是坐出租車來的。'], ['你是跟谁一起去的？', 'Nǐ shì gēn shéi yìqǐ qù de?', 'Who did you go with?', '你是跟誰一起去的？']],
    tip: 'The detail you stress goes straight after 是.', go: 'Xiǎo Lì in the Town Market, and the Culture Guide in the Academy.' },
  { id: 'work', t: 'At Work', sum: 'Meetings, files, overtime and days off.', lines: [
    ['我在一家银行工作。', 'Wǒ zài yì jiā yínháng gōngzuò.', 'I work at a bank.', '我在一家銀行工作。'], ['会议几点开始？', 'Huìyì jǐ diǎn kāishǐ?', 'What time does the meeting start?', '會議幾點開始？'], ['我明天要加班。', 'Wǒ míngtiān yào jiābān.', 'I have to work overtime tomorrow.', ''],
    ['我把文件发给你了。', 'Wǒ bǎ wénjiàn fā gěi nǐ le.', 'I have sent you the file.', '我把文件發給你了。'], ['请你再说一遍。', 'Qǐng nǐ zài shuō yí biàn.', 'Please say that again.', '請你再說一遍。'], ['我想请一天假。', 'Wǒ xiǎng qǐng yì tiān jià.', 'I would like to take a day off.', '我想請一天假。']],
    tip: '家 is the measure word for companies, shops and restaurants: 一家公司, 一家饭店.', go: 'The Work conversation in the Academy.' },
  { id: 'opinion', t: 'Opinions and Changes', sum: 'Say what you think, agree or disagree softly, and describe change.', lines: [
    ['我觉得这个主意不错。', 'Wǒ juéde zhège zhǔyi búcuò.', 'I think this idea is pretty good.', '我覺得這個主意不錯。'], ['我同意。', 'Wǒ tóngyì.', 'I agree.', ''], ['我不太喜欢。', 'Wǒ bú tài xǐhuan.', 'I do not really like it.', '我不太喜歡。'],
    ['天气越来越冷了。', 'Tiānqì yuè lái yuè lěng le.', 'The weather is getting colder and colder.', '天氣越來越冷了。'], ['我对中国文化很感兴趣。', 'Wǒ duì Zhōngguó wénhuà hěn gǎn xìngqù.', 'I am very interested in Chinese culture.', '我對中國文化很感興趣。']],
    tip: '不太 + adjective is a soft, polite "not very". 越来越 + adjective = more and more.', go: 'The Environment conversation in the Academy.' },
  { id: 'ba', t: '把 / 被 Sentences', sum: '把 moves the object in front of the verb. 被 makes the sentence passive.', lines: [
    ['请把门打开。', 'Qǐng bǎ mén dǎkāi.', 'Please open the door.', '請把門打開。'], ['我把作业做完了。', 'Wǒ bǎ zuòyè zuòwán le.', 'I finished the homework.', '我把作業做完了。'], ['蛋糕被他吃了。', 'Dàngāo bèi tā chī le.', 'The cake was eaten by him.', ''], ['我的手机被偷了。', 'Wǒ de shǒujī bèi tōu le.', 'My phone was stolen.', '我的手機被偷了。']],
    tip: 'The verb after 把 cannot stand alone. It needs a result after it: 完, 开, 了, 在 ….', go: 'Scholar Wú and Dean Lóng in the Academy, and the Work conversation.' },
  { id: 'conn', t: 'Connectors', sum: 'Paired words that join two halves of a sentence.', lines: [
    ['因为下雨，所以我不去。', 'Yīnwèi xiàyǔ, suǒyǐ wǒ bú qù.', 'Because it is raining, I am not going.', '因為下雨，所以我不去。'], ['虽然很贵，但是很好吃。', 'Suīrán hěn guì, dànshì hěn hǎochī.', 'Although it is expensive, it is delicious.', '雖然很貴，但是很好吃。'], ['如果明天下雨，我就不去了。', 'Rúguǒ míngtiān xiàyǔ, wǒ jiù bú qù le.', 'If it rains tomorrow, I will not go.', ''],
    ['他一边听音乐，一边做作业。', 'Tā yìbiān tīng yīnyuè, yìbiān zuò zuòyè.', 'He listens to music while doing homework.', '他一邊聽音樂，一邊做作業。'], ['除了汉语以外，我还会说英语。', 'Chúle Hànyǔ yǐwài, wǒ hái huì shuō Yīngyǔ.', 'Besides Chinese, I can also speak English.', '除了漢語以外，我還會說英語。']],
    tip: 'Chinese keeps both halves of the pair: 虽然 … 但是 …, 因为 … 所以 ….', go: 'Librarian Zhāo in the Academy, and the Environment conversation.' },
  { id: 'comp', t: 'Complements', sum: 'A word after the verb that says how the action turned out.', lines: [
    ['我做完了。', 'Wǒ zuòwán le.', 'I have finished. (result: 完)', ''], ['我听懂了。', 'Wǒ tīngdǒng le.', 'I understood what I heard. (result: 懂)', '我聽懂了。'], ['她说得很好。', 'Tā shuō de hěn hǎo.', 'She speaks very well. (degree: 得)', '她說得很好。'], ['请拿过来。', 'Qǐng ná guòlái.', 'Please bring it over. (direction: 过来)', '請拿過來。'], ['我听不懂。', 'Wǒ tīng bu dǒng.', 'I cannot understand. (potential: 不)', '我聽不懂。']],
    tip: '听不懂 is the phrase to use when someone speaks too fast.', go: 'Hiker Chén in the Crossroads, and the Renting conversation (搬进来).' },
  { id: 'housing', t: 'Housing', sum: 'Finding and renting a flat.', lines: [
    ['我想租房子。', 'Wǒ xiǎng zū fángzi.', 'I want to rent a flat.', ''], ['一个月的房租是多少？', 'Yí ge yuè de fángzū shì duōshao?', 'How much is the rent per month?', '一個月的房租是多少？'], ['离地铁站近吗？', 'Lí dìtiězhàn jìn ma?', 'Is it close to the MTR station?', '離地鐵站近嗎？'], ['有点儿贵。', 'Yǒudiǎnr guì.', 'It is a bit expensive.', '有點兒貴。']],
    tip: '有点儿 goes before the adjective and sounds like a complaint. 一点儿 goes after it.', go: 'The Landlord in the Academy.' },
  { id: 'culture', t: 'Culture', sum: 'Festivals, customs and good wishes.', lines: [

function pathTo(tx, ty) {
