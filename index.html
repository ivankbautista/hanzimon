<style>
:root{
  /* Layout idea: a handheld console. Dark shell, pale LCD "screen" panels, chunky ink borders. Single theme by choice. */
  color-scheme: dark;
  --shell:#1c2230;      /* page / console body */
  --shell-2:#2a3346;    /* raised shell parts */
  --lcd:#e7efd3;        /* screen paper */
  --lcd-2:#d3dfb8;      /* screen paper, shaded */
  --ink:#1d2a2a;        /* text + borders on LCD */
  --jade:#1f8a70;       /* accent */
  --gold:#f2b632;       /* badges, highlights */
  --hurt:#d0344a;       /* damage, errors */
  --t1:#cf2f3c; --t2:#15803d; --t3:#1c5fd0; --t4:#7a2fc4; --t5:#6b7280; /* tone colours */
  --display:"Press Start 2P", ui-monospace, "Courier New", monospace;
  --body:ui-monospace, "SF Mono", Menlo, Consolas, "Courier New", monospace;
  --han:"Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Heiti SC", sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden}
body{overscroll-behavior:none;background:var(--shell);color:var(--lcd);font:15px/1.45 var(--body);-webkit-tap-highlight-color:transparent}
#app{height:100%;max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;flex-direction:column;gap:8px}
#hud,#pad,.help{flex-shrink:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* HUD */
#hud{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.brand{font:12px var(--display);letter-spacing:1px;display:flex;align-items:center;gap:8px;margin-right:auto}
.brand i{font:900 20px var(--han);font-style:normal;color:var(--gold)}
#badges{display:flex;gap:4px}
.badge{width:26px;height:26px;border-radius:50%;border:2px dashed #55607a;display:grid;place-items:center;font:900 14px var(--han);color:transparent}
.badge.on{border:2px solid #7a5a00;background:var(--gold);color:#3b2b00}
.hp{display:flex;align-items:center;gap:6px;font:10px var(--display)}
.hp .bar{width:92px;height:12px;background:#0e1219;border:2px solid #55607a;border-radius:3px;overflow:hidden}
.hp .bar i{display:block;height:100%;background:#4ccf7c;transition:width .25s}
.hp .bar i.low{background:var(--hurt)}
.hud-btn{background:var(--shell-2);border:2px solid #55607a;border-radius:4px;padding:7px 9px;font:9px var(--display)}
.hud-btn:hover{border-color:var(--gold)}
.hud-btn[aria-pressed="false"]{color:#98a2b8}
#btnBgm[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}

/* Stage */
#stage{background:var(--lcd);color:var(--ink);border:4px solid #0e1219;border-radius:8px;box-shadow:0 0 0 3px var(--shell-2);overflow:hidden;flex:1;min-height:0;display:flex;flex-direction:column}
#world{position:relative;line-height:0;flex:1;min-height:0;background:#000}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
#zoneTag{position:absolute;top:8px;left:8px;background:var(--ink);color:var(--lcd);font:9px/1.4 var(--display);padding:7px 9px;border-radius:3px;opacity:0;transition:opacity .4s;pointer-events:none}
#zoneTag.show{opacity:.92}
#dialog{position:absolute;left:8px;right:8px;bottom:8px;max-width:720px;margin:0 auto;background:var(--lcd);border:3px solid var(--ink);border-radius:4px;box-shadow:0 3px 0 var(--ink);padding:10px 12px 14px;line-height:1.45;cursor:pointer;min-height:76px}
#dlgName{font:700 12px var(--body);letter-spacing:.3px;color:var(--jade);margin-bottom:6px}
#dlgText [lang]{font-family:var(--han);font-weight:500}
#dialog .next{position:absolute;right:10px;bottom:4px;font-size:11px;animation:bob .7s steps(2) infinite}
@keyframes bob{50%{transform:translateY(3px)}}

/* Battle */
#battle{flex:1;min-height:0;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
#battle>*{width:100%;max-width:720px;margin-inline:auto;flex-shrink:0}
.plate{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font:10px/1.5 var(--display)}
.chip{font:8px var(--display);padding:4px 6px;border:2px solid var(--ink);border-radius:3px;background:var(--lcd-2)}
.chip.new{background:var(--gold)}
.chip.nm{font:700 11px var(--body)}
.chip.rev{background:var(--hurt);color:#fff}
.log.npc{background:#fff;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.btn.mini{min-height:44px;padding:4px 12px;font-size:13px;box-shadow:0 2px 0 var(--ink);flex-shrink:0;white-space:nowrap}
#battle.scene .hearts{letter-spacing:1px}
#battle.scene .btn{position:relative}
#battle.scene .btn .k{position:absolute;left:8px;top:6px;margin:0}
#battle.scene .log.npc p{margin:0}
#battle.scene .log.npc .who{margin-bottom:4px}
#battle.scene .log.npc .btn.mini{font-size:18px;padding:4px 10px}
@media (max-width:520px),(max-height:560px){
  #battle.scene{gap:8px}
  #battle.scene .btn{min-height:48px;padding:5px 8px}
  #battle.scene .oh{font-size:17px}
  #battle.scene .sent{font-size:18px}
  #battle.scene .log{padding:8px 10px;min-height:0}
  #battle.scene .prompt{font-size:15px}
  #battle.scene .slots,#battle.scene .bank{min-height:64px;padding:6px;gap:6px}
  #battle.scene .tile{min-height:50px;min-width:50px;padding:4px 10px}
  #battle.scene .tile b{font-size:21px}
  #battle.scene .log.npc{font-size:14px}
  #battle.scene .sent{font-size:17px}
  #battle.scene .prompt small{margin-bottom:3px}
  #battle.scene .plate{gap:6px}
}
.log .who{font:700 11px var(--body);letter-spacing:.5px;color:var(--jade);margin:0 0 6px}
.btn .oh{display:block;font:900 19px/1.3 var(--han)}
.btn .py{display:block;font-weight:400;font-size:12px}
.tabs{display:flex;gap:8px;margin:2px 0 10px}
.tabs .btn{flex:1}
.tabs .btn[aria-selected="true"]{background:var(--ink);color:var(--lcd)}
.cards.wide{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card.pcard{display:flex;flex-direction:column;gap:3px}
.pcard .ph{font:900 20px/1.3 var(--han);text-align:left;background:none;border:0;padding:4px 0;color:var(--ink);min-height:36px}
.pcard small{font:500 13px var(--han);color:var(--t5)}
.foot .rev{color:var(--hurt);font-weight:700}
.hearts{margin-left:auto;font:18px/1 var(--body);color:var(--hurt);letter-spacing:2px}
.spirit{align-self:center;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.glyph{font:900 clamp(56px,min(19vw,17vh),120px)/1.1 var(--han);animation:float 2.4s ease-in-out infinite;text-shadow:3px 3px 0 rgba(29,42,42,.14)}
@keyframes float{50%{transform:translateY(-6px)}}
.t1{color:var(--t1)}.t2{color:var(--t2)}.t3{color:var(--t3)}.t4{color:var(--t4)}.t5{color:var(--t5)}
.glyph .ask{color:var(--ink);border-bottom:6px dotted var(--ink)}
.glyph .dim{color:#a9b596}
.pyline{font:600 20px var(--body);min-height:28px}
.meta{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;font-size:13px}
.meta span{border:2px solid var(--ink);border-radius:3px;padding:2px 8px;background:var(--lcd-2)}
.meta b{font:900 16px var(--han)}
.log{border:3px solid var(--ink);border-radius:4px;background:#f6fae9;padding:10px 12px;min-height:62px}
.log [lang],.panel [lang]{font-family:var(--han)}
.log .bad{color:var(--hurt);font-weight:700}
.log .good{color:var(--jade);font-weight:700}
.log p{margin:0 0 6px}.log p:last-child{margin:0}
.q{font-weight:700;margin:0 0 2px}
.q b{font:900 20px var(--han)}
.panel{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.panel.one{grid-template-columns:1fr}
.btn{background:var(--lcd);color:var(--ink);border:3px solid var(--ink);border-radius:4px;box-shadow:0 3px 0 var(--ink);padding:10px;font-weight:700;text-align:center;min-height:54px;touch-action:manipulation}
.btn:hover{background:#f6fae9}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn:disabled{opacity:.45;cursor:default;transform:none;box-shadow:0 3px 0 var(--ink)}
.btn.primary{background:var(--jade);color:#fff}
.btn small{display:block;font-weight:400;opacity:.8}
.btn .k{font:8px var(--display);opacity:.55;margin-right:6px}
.tb1{border-color:var(--t1);color:var(--t1);box-shadow:0 3px 0 var(--t1)}
.tb2{border-color:var(--t2);color:var(--t2);box-shadow:0 3px 0 var(--t2)}
.tb3{border-color:var(--t3);color:var(--t3);box-shadow:0 3px 0 var(--t3)}
.tb4{border-color:var(--t4);color:var(--t4);box-shadow:0 3px 0 var(--t4)}
.tb5{border-color:var(--t5);color:var(--t5);box-shadow:0 3px 0 var(--t5)}
.han{font-family:var(--han);font-weight:900}

/* Sentence tiles */
.prompt{font-weight:700;font-size:17px}
.prompt small{display:block;font:8px var(--display);color:var(--jade);margin-bottom:6px}
.slots,.bank{display:flex;flex-wrap:wrap;gap:8px;min-height:76px;padding:8px;border-radius:4px;align-content:flex-start}
.slots{border:3px dashed var(--ink);background:#f6fae9}
.bank{background:var(--lcd-2)}
.slots:empty::before{content:"Tap the tiles in the right order";opacity:.55;align-self:center}
.tile{background:#fff;border:3px solid var(--ink);border-radius:4px;box-shadow:0 3px 0 var(--ink);padding:7px 12px;min-width:56px;min-height:56px;text-align:center;color:var(--ink);touch-action:manipulation}
.tile b{display:block;font:900 24px/1.2 var(--han)}
.tile .py,.tile .pyr{display:block;font-size:11px;line-height:1.2}
.nopy .py{display:none}
.sent{font:900 20px var(--han)}

shi: 'A 是 B links two nouns: Subject + 是 + noun.',

      <button class="btn primary" data-act="med" ${got ? '' : 'disabled'}>Meditate &amp; Review<small>${got ? '3 flashcards · pass 2 to heal 50% HP' : 'seal a spirit first'}</small></button>
      <button class="btn" data-act="export">Export Save<small>Base64 code to move this save to another device</small></button>
      <button class="btn" data-act="import">Import Save<small>paste a Base64 code from another device</small></button>
      <button class="btn" data-act="curr">HSK 3.0 Curriculum<small>study cards for the three tracks</small></button>
      <button class="btn" data-act="rad">Radical Guide<small>picture meanings and memory stories</small></button>
      <button class="btn" data-act="slow">Slow audio 0.7x: ${S.slow ? 'ON' : 'OFF'}<small>applies to every Listen button</small></button>
      <button class="btn" data-act="home">Start screen<small>tracks and feedback</small></button>
    </div>
    <div id="saveBox" hidden></div>
    <p class="autosave">HP ${S.hp}/${maxHP()} · Progress saves in this browser after every battle and heal. Unsealed spirits and ones you have missed appear 3× as often in the grass${(n => n ? ' (' + n + ' flagged for review now)' : '')(WORDS.filter(w => S.dex[w.h] && S.dex[w.h].missedCount > 0).length)}.</p>
    <div class="tabs" role="tablist"><button class="btn" role="tab" data-act="tabDex" aria-selected="${dexTab === 'dex'}">HanziDex ${got}/${WORDS.length}</button><button class="btn" role="tab" data-act="tabPh" aria-selected="${dexTab === 'ph'}">Phrasebook ${Object.keys(PHR).filter(i => S.ph[i] > 0).length}/${Object.keys(PHR).length}</button></div>
    <div class="legend" ${dexTab === 'ph' ? 'hidden' : ''}><span class="t1">■ 1st tone</span><span class="t2">■ 2nd tone</span><span class="t3">■ 3rd tone</span><span class="t4">■ 4th tone</span><span class="t5">■ neutral</span><span>Tap a character to hear it.</span></div>`;
  if (dexTab === 'ph') h += phrasebookHTML();
  else ZONES.forEach((zn, z) => {
    h += `<h3>${zn.toUpperCase()}</h3><div class="cards">`;
    WORDS.filter(w => w.z === z).forEach(w => {
      const d = S.dex[w.h];
      if (d && d.c) {
        h += `<div class="card"><button class="g" data-say="${w.h}" lang="zh-Hans" aria-label="Listen to ${w.py}">${[...w.h].map((c, i) => `<span class="t${w.t[i]}">${c}</span>`).join('')}${w.tr ? `<small lang="zh-Hant">[${w.tr}]</small>` : ''}</button>
          <div><b>${w.py}</b> <span class="monic">${monSVG(w.r)}</span></div><div class="m">${w.m}</div>
          <div class="note">Radical <b lang="zh-Hans">${w.r}</b> ${w.rm} · ${w.st} strokes${w.h.length > 1 ? ' in ' + zh(w.h[0]) : ''}. ${w.n.replace(/[⺀-鿿]+/g, m => zh(m))}</div>
          <div class="xp" title="Mastery ${d.xp}/100"><i style="width:${d.xp}%"></i></div>
          <div class="foot"><span>${d.xp >= 100 ? '★ Mastered' : 'Mastery ' + d.xp + '/100 XP'}</span><span${d.missedCount > 0 ? ' class="rev"' : ''}>${d.missedCount > 0 ? 'Needs review · ' + d.missedCount + ' miss' + (d.missedCount > 1 ? 'es' : '') + (d.streak ? ' · 1 more right clears it' : '') : 'no open misses'}</span></div></div>`;
      } else {
        h += `<div class="card locked"><div class="g" lang="zh-Hans">${d && d.s ? w.h : '？'}</div><div><b>${d && d.s ? 'Seen, not sealed' : 'Not found yet'}</b></div><div>${d && d.missedCount > 0 ? 'Needs review · ' + d.missedCount + ' miss' + (d.missedCount > 1 ? 'es' : '') : 'Search the tall grass'}</div></div>`;
      }
    });
    h += '</div>';
  });
  h += `<div class="reset"><button class="btn" data-act="reset">Erase saved progress</button></div>`;
  $('#dex').innerHTML = h; $('#dex').scrollTop = 0;
}
function exportCode() { S.x = P.x; S.y = P.y; S.dir = P.dir; return btoa(unescape(encodeURIComponent(JSON.stringify(Object.assign({ v: 1 }, S))))); }
function importCode(str) {
  let j;
  try { j = JSON.parse(decodeURIComponent(escape(atob(String(str).replace(/\s+/g, ''))))); } catch (e) { return 'That code could not be read. Copy the whole code and paste it again.'; }
  if (!j || typeof j !== 'object' || !Array.isArray(j.badges) || !j.dex || typeof j.dex !== 'object') return 'That is not a HanziMon save code.';
  const num = (v, d, lo, hi) => { v = Math.round(Number(v)); return Number.isFinite(v) ? Math.max(lo, Math.min(hi, v)) : d; };
  const dex = {}, beat = {};
  WORDS.forEach(w => { const d = j.dex[w.h]; if (d && typeof d === 'object') dex[w.h] = { c: d.c ? 1 : 0, xp: num(d.xp, 0, 0, 100), missedCount: num(d.missedCount != null ? d.missedCount : d.m, 0, 0, 9999), streak: num(d.streak, 0, 0, 1), s: 1 }; });
  NPCS.forEach(n => { if (n.pool && j.beat && j.beat[n.id]) beat[n.id] = 1; });
  Object.assign(S, { badges: [0, 1, 2].map(i => j.badges[i] ? 1 : 0), dex, beat, py: j.py ? 1 : 0, heal: num(j.heal, 0, 0, 2), intro: 1, grad: j.grad ? 1 : 0, ph: {}, stamps: {}, seenDaily: 1, track: ['A', 'B', 'C'].includes(j.track) ? j.track : '', fast: j.fast ? 1 : 0, slow: j.slow ? 1 : 0, avatar: num(j.avatar, 0, 0, 3) });
  Object.keys(PHR).forEach(id => { const v = j.ph && num(j.ph[id], 0, 0, 100); if (v) S.ph[id] = v; });
  Object.keys(SCENES).forEach(id => { const v = j.stamps && num(j.stamps[id], 0, 0, 9999); if (v) S.stamps[id] = v; });
  S.hp = num(j.hp, maxHP(), 1, maxHP());
  let x = num(j.x, 4, 0, MW - 1), y = num(j.y, 7, 0, MH - 1);
  if (!walkable(x, y)) [x, y] = HEALS[S.heal];
  P.x = P.tx = S.x = x; P.y = P.ty = S.y = y; P.dir = S.dir = num(j.dir, 0, 0, 3); P.moving = false; P.pr = 0; onStep.z = zoneOf(x);
  hud(); save(); return '';
}
function wipeSave() {
  try { localStorage.removeItem(KEY); } catch (err) {}
  const keepAvatar = S.avatar;
  Object.assign(S, { x: 4, y: 7, dir: 0, hp: 20, badges: [0, 0, 0], dex: {}, beat: {}, heal: 0, intro: 0, grad: 0, ph: {}, stamps: {}, seenDaily: 0, track: '', fast: 0, slow: 0 });
    P.x = P.tx = 4; P.y = P.ty = 7; P.dir = 0; P.moving = false; onStep.z = -1; hadSave = false; started = false; hud(); 
  S.avatar = keepAvatar; migrateSave(S); hud(); showStart();
}
function closeDex() { mode = 'world'; screen_('world'); }
$('#dex').addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.say) return speak(t.dataset.say);
  if (t.dataset.act === 'close') return closeDex();
  if (t.dataset.act === 'tabDex' || t.dataset.act === 'tabPh') { dexTab = t.dataset.act === 'tabPh' ? 'ph' : 'dex'; return openDex(); }
  if (t.dataset.act === 'curr' || t.dataset.act === 'rad') { mode = 'world'; return openInfo(t.dataset.act); }
  if (t.dataset.act === 'slow') { S.slow = S.slow ? 0 : 1; save(); return openDex(); }
  if (t.dataset.act === 'home') return showStart();
  if (t.dataset.act === 'med') { closeDex(); return startQuiz('med'); }
  const box = $('#saveBox');
  if (t.dataset.act === 'export') {
    box.hidden = false;
    box.innerHTML = `<label for="saveCode">Your save code. Copy it, open HanziMon on your other device, and paste it under Import Save.</label><textarea id="saveCode" readonly spellcheck="false">${exportCode()}</textarea><div class="row"><button class="btn" data-act="copy">Copy code</button><span id="saveMsg" role="status"></span></div>`;
    return;
  }
  if (t.dataset.act === 'import') {
    box.hidden = false;
    box.innerHTML = `<label for="saveCode">Paste a save code from your other device. It replaces the progress in this browser.</label><textarea id="saveCode" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="Paste the code here"></textarea><div class="row"><button class="btn primary" data-act="load">Load this save</button><span id="saveMsg" role="status"></span></div>`;
    return;
  }
  if (t.dataset.act === 'copy') {
    const ta = $('#saveCode'), msg = $('#saveMsg'), manual = () => { ta.focus(); ta.select(); msg.textContent = 'Code selected. Copy it with your keyboard or the copy menu.'; };
    try { navigator.clipboard.writeText(ta.value).then(() => { msg.textContent = 'Copied!'; }, manual); } catch (err) { manual(); }
    return;
  }
  if (t.dataset.act === 'load') {
    const err = importCode($('#saveCode').value);
    if (err) { $('#saveMsg').textContent = err; return; }
    return openDex('Save loaded. Welcome back!');
  }
  if (t.dataset.act === 'reset') {
    if (!t.dataset.sure) { t.dataset.sure = 1; t.textContent = 'Tap again to erase everything'; return; }
    wipeSave();
  }
});

/* ───────────── INPUT ───────────── */
const KEYDIR = { ArrowDown: 0, s: 0, ArrowUp: 1, w: 1, ArrowLeft: 2, a: 2, ArrowRight: 3, d: 3 };
function press(d) { const i = held.indexOf(d); if (i >= 0) held.splice(i, 1); held.push(d); }
function release(d) { const i = held.indexOf(d); if (i >= 0) held.splice(i, 1); }
function actionA() {
  if (mode === 'dialog') nextLine();
  else if (mode === 'world' && !P.moving) interact();
  else if (mode === 'battle') { const p = $('#battle .primary:not(:disabled)'); if (p) p.click(); }
}
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target && e.target.matches && e.target.matches('textarea, input')) return;
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (k in KEYDIR) { e.preventDefault(); if (mode === 'world') press(KEYDIR[k]); return; }
  if (k === ' ' || k === 'Enter' || k === 'z' || k === 'e') { e.preventDefault(); if (!e.repeat) actionA(); return; }
  if (k === 'm' || k === 'x') { if (mode === 'dex') closeDex(); else openDex(); return; }
  if (k === 'Escape' && mode === 'dex') return closeDex();
  if (k === 'Escape' && mode === 'info') return closeInfo();
  if (mode === 'battle' && /^[1-9]$/.test(k)) { const o = document.querySelectorAll('#battle [data-ans], #battle [data-in], #battle .cmd .btn')[+k - 1]; if (o) o.click(); }
});
addEventListener('keyup', e => { const k = e.key.length === 1 ? e.key.toLowerCase() : e.key; if (k in KEYDIR) release(KEYDIR[k]); });
addEventListener('blur', () => { held.length = 0; });
document.querySelectorAll('.dpad button').forEach(bt => {
  const d = +bt.dataset.d;
  const up = () => { release(d); bt.classList.remove('held'); };
  bt.addEventListener('pointerdown', e => { e.preventDefault(); if (mode === 'world') press(d); bt.classList.add('held'); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => bt.addEventListener(ev, up));
  bt.addEventListener('contextmenu', e => e.preventDefault());
});
$('#padA').addEventListener('click', actionA);
$('#padDex').addEventListener('click', openDex);
$('#dialog').addEventListener('click', () => { if (mode === 'dialog') nextLine(); });
$('#btnDex').addEventListener('click', () => mode === 'dex' ? closeDex() : openDex());
$('#btnBgm').addEventListener('click', bgmToggle);
$('#btnRad').addEventListener('click', () => mode === 'info' && infoView === 'rad' ? closeInfo() : openInfo('rad'));
$('#btnPy').addEventListener('click', () => { S.py = S.py ? 0 : 1; hud(); save(); render(); });

/* ───────────── BOOT ───────────── */
function intro() {
  if (S.intro) return;
  S.intro = 1; save();
  say(['Welcome to HanziMon! Three zones, three Gym Leaders, and a field full of Hanzi Spirits between you and the Academy.',
    'Walk into tall grass to meet spirits. Name their tone, radical or meaning to hit them, then Seal them into your HanziDex.',
    'Talk to people with a yellow ! to battle with sentence tiles. Leaders with a red ! block the road until you win their badge.',
    'People with a speech bubble run Daily Life scenes: the restaurant, the market, the MTR station and a new colleague. Clearing them fills your Phrasebook.',
    'Grandpa Chén is just south-east of here. Talk to him first. 加油 (jiāyóu)!'], null, 'Guide');
}
if (!walkable(P.x, P.y)) { P.x = P.tx = 4; P.y = P.ty = 7; }
hud(); fit();
let last = 0;
function loop(t) { const dt = Math.min(50, t - last); last = t; update(dt); if (mode !== 'battle' && mode !== 'dex') draw(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
if (!S.ph || typeof S.ph !== 'object') S.ph = {};
if (!S.stamps || typeof S.stamps !== 'object') S.stamps = {};
// Continue Adventure: enter the world exactly as the saved game left it.
function begin() {
  started = true; mode = 'world'; screen_('world');
  tag(ZONES[zoneOf(P.x)]); onStep.z = zoneOf(P.x);
  intro();
  if (S.seenDaily) return;
  S.seenDaily = 1; save();
  if (mode === 'world') say(['New in the Village: Daily Life scenes. Look for the four people with a speech bubble along the main road.',
    'Waiter: get a table, order and pay. Stall Owner: numbers, prices and measure words. MTR Staff: asking the way. Xiǎo Lì: getting to know someone.',
    'Every phrase you use correctly is saved in the new Phrasebook tab inside the DEX.'], null, 'Update');
}
showStart();
window.__hq = { begin, pickTrack, openInfo, closeInfo, showStart, RADINFO, CURR, S, P, WORDS, POOLS, NPCS, G, map, walkable, startWild, startTrainer, startQuiz, exportCode, importCode, cv, spawnWeight, markHit, markMiss, startScene, SCENES, PHR, migrateSave, AVATARS, wipeSave, startTrainerF: n => { startTrainer(n); b.intro = 0; b.phase = 'build'; render(); }, BGM, ac: () => ac, numHan, numPy, state: () => ({ mode, b }) };
})();
</script>
